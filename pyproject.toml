[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-telegram-bot"
version = "1.0.0"
description = "Autonomous Telegram Remote Control for Google Antigravity CLI"
readme = "README.md"
authors = [
    { name = "Shubham Belbase" }
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "python-telegram-bot>=22.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/shubhambelbase/antigravity-telegram-bot"
Repository = "https://github.com/shubhambelbase/antigravity-telegram-bot"

[project.scripts]
antigravity-bot = "execution.telegram_bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["execution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
